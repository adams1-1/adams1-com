{{ define "main" }}
<h1>{{ .Site.Params.description }}</h1>
<ul style="list-style:none;padding:0;margin-top:24px">
{{ range .Site.RegularPages.ByDate.Reverse }}
<li style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #f0f0f0">
<a href="{{ .Permalink }}" style="font-size:1.1em;font-weight:600">{{ .Title }}</a>
{{ if .Description }}<p style="font-size:.9em;color:#666;margin-top:4px">{{ .Description }}</p>{{ end }}
</li>
{{ end }}
</ul>
{{ end }}
