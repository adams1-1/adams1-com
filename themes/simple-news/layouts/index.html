{{ define "main" }}
{{ if .Params.image }}<img src="{{ .Params.image }}" alt="{{ .Title }}" class="hero-img">{{ end }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<hr class="section-divider">
<h2>All Articles</h2>
<ul class="articles-list">
{{ range first 15 .Site.RegularPages.ByWeight }}
<li>
<a href="{{ .Permalink }}">{{ .Title }}</a>
{{ if .Description }}<p>{{ .Description }}</p>{{ end }}
</li>
{{ end }}
</ul>
{{ end }}
