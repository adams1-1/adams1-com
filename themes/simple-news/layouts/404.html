{{ define "main" }}
<h1>Page Not Found</h1>
<p>Sorry, the page you were looking for does not exist. <a href="/">Go to home</a>.</p>
<script>
(function() {
  var path = window.location.pathname;
  if (/\.pdf$/i.test(path)) {
    var htmlPath = path.replace(/\.pdf$/i, ".html");
    window.location.replace(htmlPath);
    return;
  }
  if (/\.htm$/i.test(path)) {
    window.location.replace(path + "l");
  }
})();
</script>
{{ end }}
